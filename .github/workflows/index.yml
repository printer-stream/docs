name: Index

# Builds the SQLite FTS5 search index from the extraction outputs, gates on the
# eval query set, and commits the index to Git LFS. Runs automatically after a
# successful Extract run, on human pushes to the relevant paths, or manually.

on:
  workflow_run:
    workflows: ["Extract"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data-extraction/pagemap/**"
      - "data-extraction/markdown/**"
      - "data-extraction-docker/indexing/**"

permissions:
  contents: write

# Shared with build-mcp-server so the image build never runs concurrently with
# (or ahead of) an index rebuild - the build must bake a finished index.
concurrency:
  group: index-and-image
  cancel-in-progress: false

jobs:
  index:
    # For the chained (workflow_run) trigger, only proceed if Extract succeeded.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build indexing image
        uses: docker/build-push-action@v6
        with:
          context: data-extraction-docker/indexing
          load: true
          tags: printer-stream-indexing:ci
          cache-from: type=gha,scope=indexing
          cache-to: type=gha,scope=indexing,mode=max

      - name: Build index
        run: docker run --rm -v "$PWD":/work printer-stream-indexing:ci build

      - name: Eval gate (recall@k)
        run: docker run --rm -v "$PWD":/work printer-stream-indexing:ci evaluate --min-recall 0.8

      - name: Commit index to LFS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data-extraction/index
          if git diff --cached --quiet; then
            echo "No index changes to commit."
          else
            git commit -m "[Auto] Rebuild search index"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
