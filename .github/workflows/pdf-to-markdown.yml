name: Render PDF to Markdown

on:
  push:
    branches:
      - main
    paths:
      - '**/*.pdf'
  workflow_dispatch:
    inputs:
      force:
        description: "Re-render every PDF, even if its Markdown already exists"
        type: boolean
        default: false

permissions:
  contents: write

# Serialize with the JPEG workflow so the two never push to main at the same time.
concurrency:
  group: pdf-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install OCR tooling
        run: sudo apt-get update && sudo apt-get install -y ocrmypdf tesseract-ocr

      - name: Install pymupdf4llm
        run: pip install pymupdf4llm

      - name: Convert new PDFs to Markdown
        env:
          # Empty on push; "true" only when a manual run requests a forced re-render.
          FORCE: ${{ inputs.force }}
        run: |
          any_new=false
          while IFS= read -r -d '' pdf; do
            # Strip leading ./ and .pdf extension to get the doc stem.
            # Sources live under pdf/<vendor>/...; strip that prefix so the stem
            # stays vendor-rooted (epson/foo) and md/ + jpeg/ paths are unchanged.
            filename="${pdf#./}"
            filename="${filename%.pdf}"
            filename="${filename#pdf/}"

            # Skip if already converted, unless a manual run forced a re-render.
            if [ "$FORCE" != "true" ] && [ -f "md-bulk/${filename}/README.md" ]; then
              continue
            fi

            # On a forced re-render, clear stale slices first so a PDF whose page
            # count changed never leaves orphaned page-NN.md behind (the zero-pad
            # width is derived from the page count).
            if [ "$FORCE" = "true" ]; then
              rm -rf "md/${filename}" "md-bulk/${filename}"
            fi

            # pymupdf4llm writes md-bulk/<stem>/README.md and md/<stem>/page-NN.md.
            # Per-page slices stay 1:1 with the JPEG page-NN.jpg renders, giving the
            # search/MCP layer a text+image pair for every page.
            python scripts/pdf_to_markdown.py "$pdf" "$filename"

            echo "Converted: $pdf -> md-bulk/${filename}/README.md + md/${filename}/page-*.md"
            any_new=true
          done < <(find . -name '*.pdf' -print0)

          if [ "$any_new" = true ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add md/ md-bulk/
            git commit -m "[Auto] Convert PDFs to Markdown (bulk + per-page)"
            git pull --rebase origin main
            git push
          else
            echo "No new PDFs to convert."
          fi
