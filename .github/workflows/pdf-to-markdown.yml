name: PDF to Markdown

on:
  push:
    branches:
      - main
    paths:
      - '**/*.pdf'
  workflow_dispatch:

permissions:
  contents: write

# Serialize with the JPEG workflow so the two never push to main at the same time.
concurrency:
  group: pdf-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install OCR tooling
        run: sudo apt-get update && sudo apt-get install -y ocrmypdf tesseract-ocr

      - name: Install pymupdf4llm
        run: pip install pymupdf4llm

      - name: Convert new PDFs to Markdown
        run: |
          any_new=false
          while IFS= read -r -d '' pdf; do
            # Strip leading ./ and .pdf extension to get the doc stem
            filename="${pdf#./}"
            filename="${filename%.pdf}"

            # Skip if already converted
            if [ -f "md-bulk/${filename}/README.md" ]; then
              continue
            fi

            # pymupdf4llm writes md-bulk/<stem>/README.md and md/<stem>/page-NN.md.
            # Per-page slices stay 1:1 with the JPEG page-NN.jpg renders, giving the
            # search/MCP layer a text+image pair for every page.
            python scripts/pdf_to_markdown.py "$pdf" "$filename"

            echo "Converted: $pdf -> md-bulk/${filename}/README.md + md/${filename}/page-*.md"
            any_new=true
          done < <(find . -name '*.pdf' -print0)

          if [ "$any_new" = true ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add md/ md-bulk/
            git commit -m "[Auto] Convert PDFs to Markdown (bulk + per-page)"
            git pull --rebase origin main
            git push
          else
            echo "No new PDFs to convert."
          fi
