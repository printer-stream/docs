name: Build MCP Server

# Builds both image variants (lean + stuffed) from mcp-server/Dockerfile and
# pushes them to GHCR, then optionally triggers a Render deploy. The stuffed
# image bakes jpeg + markdown, so checkout pulls LFS.
#
# Triggers: after a successful Index run (corpus/index changed), on mcp-server/**
# pushes (server code changed - bakes the existing committed index, no reindex),
# or manually. A first step waits for any in-progress/queued Index run so the
# build never bakes a stale or half-written index, even when one push changes
# both the indexer and the server.

on:
  workflow_run:
    workflows: ["Index"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mcp-server/**"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-mcp-server
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for any in-progress Index run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 90); do
            active=$(gh run list --repo "${{ github.repository }}" --workflow Index \
              --json status,headBranch \
              -q '[.[] | select((.status=="in_progress" or .status=="queued") and .headBranch=="main")] | length')
            if [ "${active:-0}" = "0" ]; then echo "No active Index run; proceeding."; exit 0; fi
            echo "Index run active (${active}); waiting 20s..."; sleep 20
          done
          echo "::warning::Timed out waiting for Index; proceeding anyway."

      - name: Checkout (with LFS; stuffed image bakes jpeg + markdown)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Compute version and image name
        id: meta
        run: |
          ver=$(grep __version__ mcp-server/version.py | cut -d'"' -f2)
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${repo}/mcp-server" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push lean image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mcp-server/Dockerfile
          target: lean
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=mcp-lean
          cache-to: type=gha,scope=mcp-lean,mode=max

      - name: Build and push stuffed image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mcp-server/Dockerfile
          target: stuffed
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-stuffed
            ${{ steps.meta.outputs.image }}:latest-stuffed
          cache-from: type=gha,scope=mcp-stuffed
          cache-to: type=gha,scope=mcp-stuffed,mode=max

      - name: Trigger Render deploy (optional)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$HOOK" ]; then
            echo "Triggering Render deploy hook..."
            curl -fsS -X POST "$HOOK" >/dev/null && echo "Deploy triggered."
          else
            echo "RENDER_DEPLOY_HOOK_URL not set; skipping deploy (image is in GHCR)."
          fi
