name: Build search index

on:
  push:
    branches:
      - main
    paths:
      - 'md/**'
      - 'mcp-server/indexer.py'
      - 'mcp-server/corpus.py'
  workflow_dispatch:

permissions:
  contents: write
  packages: read

# Share the serialization group so this never pushes to main at the same time
# as the PDF conversion / render workflows.
concurrency:
  group: pdf-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read deps image version
        id: deps_version
        shell: bash
        run: >-
          grep __version__ mcp-dependencies-image/version.py | cut -d "=" -f 2 | tr -d "'\" " > .deps-version
          && echo "version=$(cat .deps-version)" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull deps image
        run: >-
          docker pull
          ghcr.io/${{ github.repository }}/mcp-dependencies-image:${{ steps.deps_version.outputs.version }}

      - name: Build index
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -e DOCS_REPO_ROOT=/workspace \
            -e DOCS_INDEX_PATH=/workspace/index/specs.db \
            -e DOCS_EMBED_MODEL=BAAI/bge-small-en-v1.5 \
            -e OPENAI_API_KEY \
            ghcr.io/${{ github.repository }}/mcp-dependencies-image:${{ steps.deps_version.outputs.version }} \
            python /workspace/mcp-server/indexer.py

      - name: Commit index if changed
        run: |
          if [ -n "$(git status --porcelain index/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add index/
            git commit -m "[Auto] Rebuild search index"
            git pull --rebase origin main
            git push
          else
            echo "Index unchanged."
          fi
