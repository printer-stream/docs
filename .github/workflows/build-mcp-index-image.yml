---
name: Build MCP Index Image

on:
  push:
    branches:
      - main
    paths:
      - 'mcp-index-image/**'
  workflow_dispatch:

jobs:

  validate_new_version:
    name: Validate new version
    runs-on: ubuntu-latest
    outputs:
      planned_version: ${{ steps.validate_new_version.outputs.planned_version }}
      version_file_exists: ${{ steps.validate_new_version.outputs.version_file_exists }}
      tag_hash: ${{ steps.validate_new_version.outputs.tag_hash }}
      can_create: ${{ steps.validate_new_version.outputs.can_create }}
      tag_exists: ${{ steps.validate_new_version.outputs.tag_exists }}
      branch_name: ${{ steps.validate_new_version.outputs.branch_name }}

    steps:

      - name: Check out this repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Workaround the version file format
        id: prepare_version_file
        shell: bash
        run: >-
          grep __version__ mcp-index-image/version.py | cut -d "=" -f 2 | tr -d "'\" " > .version

      - name: Use latest released action
        id: validate_new_version
        uses: reinvented-stuff/validate-version-action@1.2.0
        with:
          version_filename: ".version"
          github_token: "${{ secrets.GITHUB_TOKEN }}"
          fail_on_error: true


  docker_image:
    name: Build Docker image
    outputs:
      job_status: ${{ job.status }}
    runs-on: ubuntu-latest

    needs:
      - validate_new_version

    env:
      PLANNED_VERSION: ${{ needs.validate_new_version.outputs.planned_version }}
      TAG_HASH: ${{ needs.validate_new_version.outputs.tag_hash }}
      CAN_CREATE_RELEASE: ${{ needs.validate_new_version.outputs.can_create }}
      TAG_EXISTS: ${{ needs.validate_new_version.outputs.tag_exists }}
      BRANCH_NAME: ${{ needs.validate_new_version.outputs.branch_name }}
      APP_NAME: "mcp-index-image"


    steps:

      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read deps image version
        id: deps_version
        shell: bash
        run: >-
          grep __version__ mcp-dependencies-image/version.py | cut -d "=" -f 2 | tr -d "'\" " > .deps-version
          && echo "version=$(cat .deps-version)" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # This image is built FROM the dependencies layer. When a push bumps the
      # deps version, the deps build runs concurrently with this one, so wait
      # until the exact deps tag is published to GHCR before building. No-op when
      # the deps image already exists (deps not rebuilt, or already finished).
      - name: Wait for the dependencies image to be published
        shell: bash
        env:
          DEPS_IMAGE: "ghcr.io/${{ github.repository }}/mcp-dependencies-image:${{ steps.deps_version.outputs.version }}"
        run: |
          echo "Ensuring ${DEPS_IMAGE} exists before building (it may be mid-build)..."
          for attempt in $(seq 1 60); do
            if docker manifest inspect "${DEPS_IMAGE}" >/dev/null 2>&1; then
              echo "Dependencies image is available; proceeding."
              exit 0
            fi
            echo "  [${attempt}/60] not available yet; sleeping 15s"
            sleep 15
          done
          echo "::error::Timed out (15 min) waiting for ${DEPS_IMAGE}. Did the dependencies image build succeed?"
          exit 1

      - name: Build Docker image
        id: build_docker_image
        uses: reinvented-stuff/build-docker-image-action@2.7.0
        with:
          registry_address: "ghcr.io"
          registry_username: "${{ github.actor }}"
          registry_token: "${{ secrets.GITHUB_TOKEN }}"
          name: "${{ github.repository }}/${{ env.APP_NAME }}"
          planned_version: "${{ env.PLANNED_VERSION }}"
          default_branch: main
          dockerfile: "mcp-index-image/Dockerfile"
          build_args: |-
            APP_VERSION=${{ env.PLANNED_VERSION }}
            DEPS_IMAGE=ghcr.io/${{ github.repository }}/mcp-dependencies-image
            DEPS_VERSION=${{ steps.deps_version.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

...
