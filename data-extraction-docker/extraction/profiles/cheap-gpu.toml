# Cheap-GPU profile: a modest local GPU (e.g. 24-48 GB) running a smaller VLM via
# vLLM/Ollama. Lower quality than h200's 32B, but self-hosted and inexpensive.
# One model serves every phase (markdown/describe/sections via text_only):
#   vllm serve Qwen/Qwen3-VL-8B-Instruct --port 8000   (or its -FP8 build / Ollama)

[render]
small_width = 1024
big_dpi = 220
jpeg_quality = 88

[markdown]
backend = "vlm"
concurrency = 8          # in-flight requests; keep modest on a small GPU
[markdown.provider]
base_url = "http://localhost:8000/v1"
model = "Qwen/Qwen3-VL-8B-Instruct"
api_key_env = "VLLM_API_KEY"
max_tokens = 4096
timeout = 300

[quality]
backend = "heuristic"
threshold = 0.5

[describe]
enabled = true
gate = "illustrated"
image = "big"
concurrency = 8
[describe.provider]
base_url = "http://localhost:8000/v1"
model = "Qwen/Qwen3-VL-8B-Instruct"
api_key_env = "VLLM_API_KEY"
max_tokens = 400

[sections]
backend = "llm-text"
[sections.provider]
base_url = "http://localhost:8000/v1"
model = "Qwen/Qwen3-VL-8B-Instruct"   # same served model; sections uses text_only
api_key_env = "VLLM_API_KEY"
max_tokens = 2048
