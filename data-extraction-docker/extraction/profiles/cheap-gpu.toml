# Cheap-GPU profile: a modest local GPU (e.g. 24-48 GB) running smaller VLMs via
# vLLM/Ollama. Lower quality than h200's 72B, but self-hosted and inexpensive.
#   vllm serve Qwen/Qwen2.5-VL-7B-Instruct --port 8000   (or Ollama qwen2.5vl)

[render]
small_width = 1024
big_dpi = 220
jpeg_quality = 88

[markdown]
backend = "vlm"
image = "big"
[markdown.provider]
base_url = "http://localhost:8000/v1"
model = "Qwen/Qwen2.5-VL-7B-Instruct"
api_key_env = "VLLM_API_KEY"
max_tokens = 4096
timeout = 300

[quality]
backend = "heuristic"
threshold = 0.5

[describe]
enabled = true
gate = "illustrated"
image = "big"
[describe.provider]
base_url = "http://localhost:8000/v1"
model = "Qwen/Qwen2.5-VL-7B-Instruct"
api_key_env = "VLLM_API_KEY"
max_tokens = 400

[sections]
backend = "llm-text"
[sections.provider]
base_url = "http://localhost:8000/v1"
model = "Qwen/Qwen2.5-7B-Instruct"
api_key_env = "VLLM_API_KEY"
max_tokens = 2048
